<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6B5CE7">
    <meta property="og:title" content="頭皮養護 × 睡眠品質檢測">
    <meta property="og:description" content="15 道題目，找出最適合你的養護方案">
    <title>頭皮養護 × 睡眠品質 — 個人化檢測</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
</head>

<body>
    <div id="app">
        <!-- ===== Welcome Screen ===== -->
        <section id="screen-welcome" class="screen active">
            <div class="welcome-bg">
                <div class="bubble bubble-1"></div>
                <div class="bubble bubble-2"></div>
                <div class="bubble bubble-3"></div>
            </div>
            <div class="welcome-content">
                <div class="welcome-icon">🌿</div>
                <h1 class="welcome-title">頭皮養護 × 睡眠品質<br>個人化檢測</h1>
                <p class="welcome-subtitle">透過 15 道情境題，了解你的頭皮與睡眠狀態<br>找到最適合你的養護方案</p>
                <div class="welcome-badges">
                    <span class="badge">🕐 約 3 分鐘</span>
                    <span class="badge">📋 15 道題</span>
                    <span class="badge">🎯 4 種結果</span>
                </div>
                <button id="btn-start" class="btn-primary">開始檢測</button>
            </div>
        </section>

        <!-- ===== Quiz Screen ===== -->
        <section id="screen-quiz" class="screen">
            <div class="quiz-header">
                <button id="btn-back" class="btn-back" aria-label="上一題">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="progress-wrapper">
                    <div class="progress-text"><span id="q-current">1</span> / <span id="q-total">15</span></div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
            <div class="quiz-body">
                <div id="question-container" class="question-container">
                    <h2 id="question-text" class="question-text"></h2>
                    <div id="options-container" class="options-container"></div>
                </div>
            </div>
        </section>

        <!-- ===== Loading Screen ===== -->
        <section id="screen-loading" class="screen">
            <div class="loading-content">
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                    <div class="spinner-icon">✨</div>
                </div>
                <h2 class="loading-title">正在分析你的結果</h2>
                <p class="loading-subtitle">結合頭皮狀態與睡眠品質數據...</p>
                <div class="loading-bar">
                    <div id="loading-progress" class="loading-bar-fill"></div>
                </div>
            </div>
        </section>

        <!-- ===== Result Screen ===== -->
        <section id="screen-result" class="screen">
            <div class="result-content">
                <div id="result-badge" class="result-badge"></div>
                <div id="result-icon" class="result-icon"></div>
                <h2 id="result-title" class="result-title"></h2>
                <p id="result-subtitle" class="result-subtitle"></p>
                <div id="result-description" class="result-description"></div>
                <div class="result-recommendation">
                    <h3>💡 專屬養護建議</h3>
                    <p id="result-recommendation"></p>
                </div>
                <div class="result-scores">
                    <h3>你的檢測數據</h3>
                    <div id="score-bars" class="score-bars"></div>
                </div>
                <button id="btn-cta" class="btn-cta">查看推薦養護方案 →</button>
                <button id="btn-share" class="btn-share">分享給朋友</button>
                <button id="btn-retry" class="btn-retry">重新測驗</button>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
